<body>

<div class="container">

    <header>
        <h1>GigaChad's Audio Pro</h1>
        <p class="subtitle">
            Browser-based audio processing & enhancement
        </p>
    </header>

    <div class="workspace">

        <!-- Visualization -->
        <canvas id="visualizer"></canvas>

        <div class="controls-grid">

            <!-- Audio Input -->
            <div>
                <label for="audioInput">SOURCE MATERIAL (AUDIO)</label>

                <input
                    type="file"
                    id="audioInput"
                    accept="audio/*"
                >
            </div>

            <!-- Tonal Slider -->
            <div>

                <div class="slider-row">
                    <label for="tunerRange">
                        TONAL DENSITY
                    </label>

                    <span id="sliderValue">
                        50%
                    </span>
                </div>

                <input
                    type="range"
                    id="tunerRange"
                    min="1"
                    max="100"
                    value="50"
                >

            </div>

            <!-- Process -->
            <button
                class="primary-btn"
                id="processBtn"
                disabled
            >
                <span
                    class="spinner"
                    id="loader"
                ></span>

                <span id="btnText">
                    Initialize System
                </span>
            </button>

            <!-- Status -->
            <div class="status-area">

                <span
                    id="statusBadge"
                    class="badge idle"
                >
                    Ready
                </span>

            </div>

            <!-- Player -->
            <div id="playerSection" style="display:none;">

                <label>
                    PROCESSED AUDIO
                </label>

                <audio
                    id="audioPlayer"
                    controls
                ></audio>

            </div>

            <!-- Export -->
            <div
                class="export-section"
                id="exportSection"
            >

                <button
                    class="secondary-btn"
                    id="exportBtn"
                >
                    Export WAV
                </button>

            </div>

            <div class="info">
                Processing is performed locally in your browser.
                Your audio is not uploaded to a server.
            </div>

        </div>

    </div>

</div>


<script>

    /* =========================================
       ELEMENTS
    ========================================= */

    const audioInput =
        document.getElementById("audioInput");

    const tunerRange =
        document.getElementById("tunerRange");

    const sliderValue =
        document.getElementById("sliderValue");

    const processBtn =
        document.getElementById("processBtn");

    const btnText =
        document.getElementById("btnText");

    const loader =
        document.getElementById("loader");

    const statusBadge =
        document.getElementById("statusBadge");

    const visualizer =
        document.getElementById("visualizer");

    const audioPlayer =
        document.getElementById("audioPlayer");

    const playerSection =
        document.getElementById("playerSection");

    const exportSection =
        document.getElementById("exportSection");

    const exportBtn =
        document.getElementById("exportBtn");


    /* =========================================
       AUDIO VARIABLES
    ========================================= */

    let audioContext = null;

    let sourceBuffer = null;

    let processedBuffer = null;

    let processedBlob = null;

    let audioURL = null;


    /* =========================================
       CANVAS
    ========================================= */

    const canvasContext =
        visualizer.getContext("2d");

    function resizeCanvas() {

        const ratio =
            window.devicePixelRatio || 1;

        visualizer.width =
            visualizer.clientWidth * ratio;

        visualizer.height =
            visualizer.clientHeight * ratio;

        canvasContext.scale(ratio, ratio);
    }

    resizeCanvas();

    window.addEventListener(
        "resize",
        resizeCanvas
    );


    function drawWaveform(buffer) {

        const width =
            visualizer.clientWidth;

        const height =
            visualizer.clientHeight;

        canvasContext.clearRect(
            0,
            0,
            width,
            height
        );

        canvasContext.beginPath();

        canvasContext.lineWidth = 2;

        const data =
            buffer.getChannelData(0);

        const step =
            Math.ceil(data.length / width);

        const amp =
            height / 2;

        for (
            let i = 0;
            i < width;
            i++
        ) {

            let min = 1;
            let max = -1;

            for (
                let j = 0;
                j < step;
                j++
            ) {

                const index =
                    i * step + j;

                if (index >= data.length)
                    break;

                const value =
                    data[index];

                if (value < min)
                    min = value;

                if (value > max)
                    max = value;
            }

            canvasContext.moveTo(
                i,
                (1 + min) * amp
            );

            canvasContext.lineTo(
                i,
                (1 + max) * amp
            );
        }

        canvasContext.strokeStyle =
            "#38bdf8";

        canvasContext.stroke();
    }


    /* =========================================
       SLIDER
    ========================================= */

    tunerRange.addEventListener(
        "input",
        () => {

            const value =
                Number(tunerRange.value);

            sliderValue.textContent =
                value + "%";

        }
    );


    /* =========================================
       STATUS
    ========================================= */

    function setStatus(
        text,
        type = "idle"
    ) {

        statusBadge.textContent = text;

        statusBadge.className =
            "badge " + type;
    }


    /* =========================================
       LOAD AUDIO
    ========================================= */

    audioInput.addEventListener(
        "change",
        async () => {

            const file =
                audioInput.files[0];

            if (!file)
                return;

            try {

                setStatus(
                    "Loading audio...",
                    "active"
                );

                processBtn.disabled = true;

                if (!audioContext) {

                    audioContext =
                        new (
                            window.AudioContext ||
                            window.webkitAudioContext
                        )();

                }

                const arrayBuffer =
                    await file.arrayBuffer();

                sourceBuffer =
                    await audioContext.decodeAudioData(
                        arrayBuffer
                    );

                drawWaveform(sourceBuffer);

                processBtn.disabled = false;

                btnText.textContent =
                    "Process Audio";

                setStatus(
                    "Audio Loaded",
                    "active"
                );

            } catch (error) {

                console.error(error);

                setStatus(
                    "Invalid Audio",
                    "error"
                );

                processBtn.disabled = true;
            }
        }
    );


    /* =========================================
       PROCESS AUDIO
    ========================================= */

    processBtn.addEventListener(
        "click",
        async () => {

            if (!sourceBuffer)
                return;

            try {

                processBtn.disabled = true;

                loader.classList.add("show");

                btnText.textContent =
                    "Processing...";

                setStatus(
                    "Processing",
                    "active"
                );

                /*
                    Give browser time to update UI
                    before heavy processing.
                */

                await new Promise(
                    resolve =>
                        setTimeout(resolve, 100)
                );

                const density =
                    Number(tunerRange.value) / 100;

                const sampleRate =
                    sourceBuffer.sampleRate;

                const channels =
                    sourceBuffer.numberOfChannels;

                const length =
                    sourceBuffer.length;

                processedBuffer =
                    audioContext.createBuffer(
                        channels,
                        length,
                        sampleRate
                    );


                /* =================================
                   SIMPLE AUDIO PROCESSING

                   The slider controls the amount
                   of tonal shaping.

                   This is general enhancement,
                   not detector evasion.
                ================================= */

                for (
                    let channel = 0;
                    channel < channels;
                    channel++
                ) {

                    const input =
                        sourceBuffer.getChannelData(
                            channel
                        );

                    const output =
                        processedBuffer.getChannelData(
                            channel
                        );

                    let previous = 0;

                    for (
                        let i = 0;
                        i < length;
                        i++
                    ) {

                        let sample =
                            input[i];

                        /*
                            Gentle high-frequency
                            smoothing.
                        */

                        const smooth =
                            previous * 0.15 +
                            sample * 0.85;

                        previous = sample;

                        /*
                            Tonal density control.
                        */

                        const gain =
                            0.92 +
                            density * 0.16;

                        sample =
                            smooth * gain;

                        /*
                            Soft saturation.
                        */

                        sample =
                            Math.tanh(sample);

                        /*
                            Prevent clipping.
                        */

                        output[i] =
                            Math.max(
                                -1,
                                Math.min(
                                    1,
                                    sample
                                )
                            );
                    }
                }


                /* Create WAV */

                processedBlob =
                    audioBufferToWav(
                        processedBuffer
                    );

                if (audioURL) {

                    URL.revokeObjectURL(
                        audioURL
                    );

                }

                audioURL =
                    URL.createObjectURL(
                        processedBlob
                    );

                audioPlayer.src =
                    audioURL;

                playerSection.style.display =
                    "block";

                exportSection.classList.add(
                    "show"
                );

                drawWaveform(
                    processedBuffer
                );

                setStatus(
                    "Processing Complete",
                    "active"
                );

                btnText.textContent =
                    "Process Again";

            } catch (error) {

                console.error(error);

                setStatus(
                    "Processing Failed",
                    "error"
                );

                btnText.textContent =
                    "Try Again";

            } finally {

                loader.classList.remove(
                    "show"
                );

                processBtn.disabled = false;
            }
        }
    );


    /* =========================================
       WAV ENCODER
    ========================================= */

    function audioBufferToWav(buffer) {

        const numberOfChannels =
            buffer.numberOfChannels;

        const sampleRate =
            buffer.sampleRate;

        const format = 1;

        const bitDepth = 16;

        const samples =
            buffer.length;

        const blockAlign =
            numberOfChannels *
            bitDepth / 8;

        const byteRate =
            sampleRate *
            blockAlign;

        const dataSize =
            samples *
            blockAlign;

        const bufferSize =
            44 + dataSize;

        const arrayBuffer =
            new ArrayBuffer(bufferSize);

        const view =
            new DataView(arrayBuffer);


        function writeString(
            offset,
            string
        ) {

            for (
                let i = 0;
                i < string.length;
                i++
            ) {

                view.setUint8(
                    offset + i,
                    string.charCodeAt(i)
                );

            }
        }


        writeString(0, "RIFF");

        view.setUint32(
            4,
            36 + dataSize,
            true
        );

        writeString(8, "WAVE");

        writeString(12, "fmt ");

        view.setUint32(
            16,
            16,
            true
        );

        view.setUint16(
            20,
            format,
            true
        );

        view.setUint16(
            22,
            numberOfChannels,
            true
        );

        view.setUint32(
            24,
            sampleRate,
            true
        );

        view.setUint32(
            28,
            byteRate,
            true
        );

        view.setUint16(
            32,
            blockAlign,
            true
        );

        view.setUint16(
            34,
            bitDepth,
            true
        );

        writeString(
            36,
            "data"
        );

        view.setUint32(
            40,
            dataSize,
            true
        );


        let offset = 44;

        for (
            let i = 0;
            i < samples;
            i++
        ) {

            for (
                let channel = 0;
                channel < numberOfChannels;
                channel++
            ) {

                let sample =
                    buffer.getChannelData(
                        channel
                    )[i];

                sample =
                    Math.max(
                        -1,
                        Math.min(
                            1,
                            sample
                        )
                    );

                const value =
                    sample < 0
                        ? sample * 0x8000
                        : sample * 0x7FFF;

                view.setInt16(
                    offset,
                    value,
                    true
                );

                offset += 2;
            }
        }

        return new Blob(
            [arrayBuffer],
            {
                type: "audio/wav"
            }
        );
    }


    /* =========================================
       EXPORT WAV
    ========================================= */

    exportBtn.addEventListener(
        "click",
        () => {

            if (!processedBlob)
                return;

            const url =
                URL.createObjectURL(
                    processedBlob
                );

            const link =
                document.createElement("a");

            link.href = url;

            link.download =
                "processed-audio.wav";

            document.body.appendChild(
                link
            );

            link.click();

            document.body.removeChild(
                link
            );

            setTimeout(
                () =>
                    URL.revokeObjectURL(url),
                1000
            );

            setStatus(
                "WAV Exported",
                "active"
            );
        }
    );


    /* =========================================
       CLEANUP
    ========================================= */

    window.addEventListener(
        "beforeunload",
        () => {

            if (audioURL) {

                URL.revokeObjectURL(
                    audioURL
                );

            }

        }
    );

</script>

</body>
</html>
