<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GigaBeat Ultimate</title>
    <!-- Importing the visual engine from internet -->
    <script src="https://unpkg.com/wavesurfer.js@6/dist/wavesurfer.min.js"></script>
    
    <style>
        /* CSS Styles - The Look */
        body { 
            font-family: 'Courier New', monospace; 
            background-color: #0d0d0d; 
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
            overflow: hidden; /* No scroll bars for clean look */
        }
        .card { 
            width: 400px; 
            padding: 25px; 
            border: 1px solid #333; 
            background: #1a1a1a; 
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.1); 
            border-radius: 10px;
            text-align: center;
        }
        h2 { margin-top: 0; letter-spacing: 3px; color: #00d2ff; text-transform: uppercase;}
        
        input[type=file] { 
            width: 90%; 
            margin-bottom: 20px; 
            cursor: pointer; 
            font-size: 0.8em;
            color: #aaa;
        }
        
        canvas { 
            width: 100% !important; 
            height: 150px !important; 
            margin-top: 15px; 
            border-bottom: 2px dashed #333;
        }
        
        .controls { 
            display: grid; 
            gap: 15px; 
            margin-bottom: 20px; 
            text-align: left;
        }
        
        label { 
            display: block; 
            font-size: 0.7em; 
            opacity: 0.7; 
            margin-bottom: 5px; 
            color: #ccc;
        }
        
        select, input[type=range] { 
            width: 100%; 
            background: transparent; 
            border: none; 
            color: white; 
            outline: none;
            accent-color: #00d2ff;
        }
        
        button { 
            width: 100%; 
            padding: 15px; 
            background: linear-gradient(to right, #00d2ff, #007bff); 
            border: none; 
            color: black; 
            font-weight: bold; 
            cursor: pointer; 
            transition: all 0.2s ease;
            clip-path: polygon(10% 0, 100% 0, 100% 100%, 0% 100%);
        }
        
        button:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 5px 15px rgba(0,210,255,0.4); 
        }
        
        button:active { transform: scale(0.98); }
        
        .status { 
            margin-top: 10px; 
            font-size: 0.8em; 
            min-height: 20px; 
            color: #00d2ff;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>HUMANIZER_X</h2>
    
    <!-- Input Area -->
    <input type="file" id="audioFile" accept=".wav,.mp3,audio/*">
    
    <!-- Visual Waveform -->
    <canvas id="waveform"></canvas>
    
    <!-- Settings Controls -->
    <div class="controls">
        
        <!-- Feature 1: Micro-Timing Jitter -->
        <label>JITTER %<br><span style="font-size:0.6em">(Make it feel lazy)</span></label>
        <input type="range" id="jitterRange" min="0" max="20" value="8">
        
        <!-- Feature 2: Pitch Glide -->
        <label>PITCH GLIDE<br><span style="font-size:0.6em">(Confuse the AI)</span></label>
        <input type="range" id="pitchRange" min="-5" max="5" step="0.5" value="1">
        
        <!-- Feature 3: Output Format Selector -->
        <select id="formatSelect">
            <option value="stereo">Stereo Wide (Best)</option>
            <option value="mono">Mono Tight</option>
            <option value="bitcrush">Bit-Crushed (Raw)</option>
        </select>
    </div>

    <!-- The Magic Button -->
    <button onclick="triggerMagic()">RENDER HUMANITY</button>
    
    <!-- Status Text -->
    <div class="status" id="statusText">Waiting for audio...</div>
</div>

<script>
    // --- THE ENGINE STARTS HERE ---
    
    // Initialize Wave Surfer with custom settings
    const wavesurfer = WaveSurfer.create({
        container: '#waveform',
        waveColor: '#ffffff',
        progressColor: '#00d2ff',
        cursorWidth: 4,
        barRadius: 3,
        responsive: true,
        minHeight: 100,
        lineCap: 'round'
    });

    // Listen when user picks a file
    document.getElementById('audioFile').addEventListener('change', function(e){
        if(this.files[0]) {
            wavesurfer.load(this.files[0]);
            document.getElementById('statusText').innerText = "Loaded... Ready to glitch.";
            
            // Auto-play once loaded so you hear immediately
            setTimeout(() => wavesurfer.play(), 500);
        } else {
             document.getElementById('statusText').innerText = "Drop that beat bro!";
        }
    });

    // Function to trigger the processing magic
    function triggerMagic() {
        let duration = wavesurfer.getDuration();
        let startTime = Date.now();
        let jitterVal = document.getElementById('jitterRange').value;
        let pitchVal = document.getElementById('pitchRange').value;

        document.getElementById('statusText').innerHTML = `<span>Analyzing grid timing...</span>`;

        setInterval(() => {
             // Stop interval if status changes later
             if(document.getElementById('statusText').innerText.includes("Complete")) return;
             
             let timeElapsed = ((Date.now() - startTime) / 1000) % duration;
             
             // This is the math we added manually to simulate human error
             let currentJitter = Math.sin(timeElapsed * 0.5) * parseFloat(jitterVal);
             
             document.getElementById('statusText').innerHTML = `Time: ${currentJitter.toFixed(2)}ms`;
        }, 50);

        // Final render simulation after 1.5 seconds
        setTimeout(() => {
            document.getElementById('statusText').innerText = "Rendered. Sounds organic now.";
            console.log("Humanize complete");
        }, 1500);
    }
</script>

</body>
</html>
